name: carebridge_ai
description: >-
  CareBridge AI — offline-first, AI-assisted community health companion for
  frontline health workers (CHOs) and caregivers in Northern Ghana. Built for
  the UNICEF Start-Up Lab "AI for Nurturing Care" Hackathon 2026.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing with role guards
  go_router: ^14.6.2

  # Offline-first storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secure credential / PIN storage
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Device + connectivity awareness
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.20.2

  # Local-language audio guidance
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

  # Referral QR (closes the last-mile loop)
  qr_flutter: ^4.1.0

  # Utility
  uuid: ^4.5.1
  collection: ^1.18.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  sqflite_common_ffi_web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
