name: carebridge_ai
description: >-
  CareBridge AI — offline-first, AI-assisted community health companion for
  frontline health workers (CHOs) and caregivers in Northern Ghana. Built for
  the UNICEF Start-Up Lab "AI for Nurturing Care" Hackathon 2026.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing with role guards
  go_router: ^14.6.2

  # Offline-first storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5

  # Secure credential / PIN storage
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Device + connectivity awareness
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.20.2

  # Local-language audio guidance
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

  # Referral QR (closes the last-mile loop)
  qr_flutter: ^4.1.0

  # Utility
  uuid: ^4.5.1
  collection: ^1.18.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  sqflite_common_ffi_web: ^1.1.2

  # District-server communication. package:http selects the right client per
  # platform (IOClient on Android/desktop, BrowserClient/XHR on web). The web
  # build cannot use dart:io's HttpClient at all — every sync/auth request
  # therefore goes through lib/data/sync/http_client.dart which wraps this.
  http: ^1.2.2

  # On-device offline ML (TFLite INT8 Random Forest classifiers)
  # Four maternal/child risk models: neonatal_sepsis, child_pneumonia,
  # preeclampsia_risk, lbw_sga. INT8 quantized, <2 MB each, 10–40 ms ARM64.
  tflite_flutter: ^0.11.0

  # On-device neural translation (MarianMT ONNX: Hausa, Twi).
  # App-owned native isolates and same-origin WASM workers share contracts.
  # Neural language packs are installed separately; recordings stay bundled.
  onnxruntime: ^1.4.1
  dart_sentencepiece_tokenizer: 1.4.0

  # On-device neural TTS using Piper VITS ONNX models.
  # Runs via the existing onnxruntime bindings (zero extra native deps).
  # Rule-based phonemizer for Hausa/Twi (both phonemic orthographies).
  # Models: assets/tts/hausa_piper/ + twi_piper/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/audio/dagbani_mms/
    - assets/audio/hausa_mms/
    - assets/audio/twi_mms/
    - assets/images/
    - assets/fonts/
    - assets/models/
    # Flutter does not recurse into asset directories. These four are the
    # offline voice packs; NativePackStore loads them by directory path, so
    # dropping a line here ships an app that silently has no neural translation
    # or TTS for that language.
    - assets/models/translation_hausa/
    - assets/models/translation_twi/
    - assets/tts/hausa_piper/
    - assets/tts/twi_piper/
  fonts:
    # CanvasKit always requests a family named Roboto at engine startup.
    # Alias that fallback to bundled Inter, our app font, to avoid a remote
    # font download before GoogleFonts runtime-fetching policy takes effect.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # The caregiver Check flow styles its premium surfaces with raw
    # `fontFamily: 'Sora'` — these declarations are what make that resolve
    # instead of silently falling back to the platform font.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
